name: Android CI

# Every push builds a debug-signed, sideloadable APK and uploads it as an
# artifact. See README -> Build. No secrets, no signing keys: the debug
# keystore is the local Gradle default, so the APK is sideload-only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelpet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
