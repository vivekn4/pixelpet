plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.vn.pixelpet"
    compileSdk 34

    defaultConfig {
        applicationId "com.vn.pixelpet"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // No viewBinding / dataBinding: plain findViewById keeps the build dependency-free.
}

dependencies {
    // Zero external dependencies by design — framework APIs only.
    // (test frameworks intentionally omitted; QA is static + build verification)
}
